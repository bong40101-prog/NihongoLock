plugins {
    id 'com.android.application'
}

def keyProps = new Properties()
def keyPropsFile = rootProject.file('keystore.properties')
if (keyPropsFile.exists()) {
    keyPropsFile.withInputStream { keyProps.load(it) }
}

def ksPath = keyProps.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_PATH')
def ksStorePassword = keyProps.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def ksAlias = keyProps.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS')
def ksKeyPassword = keyProps.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD')
def signingReady = ksPath && ksStorePassword && ksAlias && ksKeyPassword

android {
    namespace 'com.jk.nihongolock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jk.nihongolock'
        minSdk 28
        targetSdk 35
        versionCode 7
        versionName '0.3.4'
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(ksPath)
                storePassword ksStorePassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingReady) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Release packaging must not be blocked by an unavailable remote Lint
    // dependency; Java compilation and debug packaging still run normally.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
